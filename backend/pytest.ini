[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto

# Markers
markers =
    unit: Unit tests (fast, isolated)
    integration: Integration tests (may need database/network)
    slow: Slow running tests
    async_test: Async tests

# Coverage settings
addopts = 
    -v
    --tb=short
    --strict-markers

# Ignore patterns
norecursedirs = 
    .git
    __pycache__
    venv
    .venv
    node_modules
    pgvector
    pgvector_extracted

# Logging
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(message)s

# Async
asyncio_default_fixture_loop_scope = function
