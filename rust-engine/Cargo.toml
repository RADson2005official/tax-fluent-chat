[package]
name = "tax-engine-rs"
version = "0.1.0"
edition = "2021"
authors = ["Tax Filing Team"]
description = "High-performance tax calculation engine with financial precision"

[lib]
name = "tax_engine_rs"
crate-type = ["cdylib"]  # Creates a shared library for Python

[dependencies]
# PyO3 for Python bindings
pyo3 = { version = "0.20", features = ["extension-module", "abi3-py310"] }

# Decimal arithmetic for financial precision
rust_decimal = "1.33"
rust_decimal_macros = "1.33"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
# Property-based testing
proptest = "1.4"

[profile.release]
# Optimize for speed
opt-level = 3
lto = true
codegen-units = 1
